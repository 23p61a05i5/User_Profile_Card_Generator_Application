<!doctype html><html><head><meta charset="utf-8"><title>Profile Card Generator</title><link rel="stylesheet" href="{{url_for('static',filename='css/main.css')}}"></head><body><main><h1>Profile Card Generator</h1><p class="muted">Submit a form and Flask returns a formatted profile card.</p><div class="layout"><form class="panel" method="post"><label>Name<input name="name" required></label><label>Role<input name="role" placeholder="Student / Developer"></label><label>Bio<textarea name="bio" maxlength="300"></textarea></label><label>Image URL<input name="image_url" type="url" placeholder="https://..."></label><button>Generate card</button></form>{% if profile %}<article class="profile card"><img src="{{profile.image_url or 'https://placehold.co/150x150?text=Profile'}}" alt="Profile"><h2>{{profile.name}}</h2><strong>{{profile.role}}</strong><p>{{profile.bio}}</p></article>{% else %}<article class="card">Your generated card will appear here.</article>{% endif %}</div></main></body></html>
